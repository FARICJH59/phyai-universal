name: Phase 1 Contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/unit/test_phase1_contracts.py -q
      - run: python -m src.phase1_contracts.harness.validate
