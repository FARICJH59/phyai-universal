name: Phase 12 Acceleration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase12-acceleration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/unit/test_phase12_acceleration.py -q
