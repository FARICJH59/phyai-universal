name: Phase 13 Latency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase13-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/unit/test_phase13_latency.py -q
