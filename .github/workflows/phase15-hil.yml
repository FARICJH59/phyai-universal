name: Phase 15 HIL Boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase15-hil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/unit/test_admission_proof.py tests/unit/test_lease_fencing.py tests/unit/test_hoare_lease_fence_adapter.py tests/unit/test_phase15_hil.py -q
