name: Phase 16-17 Boundary

on:
  push:
    branches: [main]
    paths:
      - 'src/production_hardening/phase16_17_boundary.py'
      - 'src/production_hardening/phase16_hoare_integration.py'
      - 'src/production_hardening/phase17_evidence.py'
      - 'tests/unit/test_phase16_17_boundary.py'
      - '.github/workflows/phase16-17-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/production_hardening/phase16_17_boundary.py'
      - 'src/production_hardening/phase16_hoare_integration.py'
      - 'src/production_hardening/phase17_evidence.py'
      - 'tests/unit/test_phase16_17_boundary.py'
      - '.github/workflows/phase16-17-boundary.yml'

jobs:
  phase16-17-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/unit/test_phase16_17_boundary.py -q
