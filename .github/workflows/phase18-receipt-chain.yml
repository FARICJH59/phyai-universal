name: Phase 18 Receipt Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase18-receipt-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/unit/test_phase18_receipt_chain.py -q
