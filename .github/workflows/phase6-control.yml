name: phase6-control

on:
  push:
    branches: [main]
    paths:
      - 'src/phase6_control/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase6_control.py'
      - 'pyproject.toml'
      - '.github/workflows/phase6-control.yml'
  pull_request:
    paths:
      - 'src/phase6_control/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase6_control.py'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/unit/test_phase6_control.py -q
