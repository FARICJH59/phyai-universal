name: phase7-reasoning

on:
  push:
    branches: [main]
    paths:
      - 'src/phase7_reasoning/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase7_reasoning.py'
      - 'pyproject.toml'
      - '.github/workflows/phase7-reasoning.yml'
  pull_request:
    paths:
      - 'src/phase7_reasoning/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase7_reasoning.py'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/unit/test_phase7_reasoning.py -q
