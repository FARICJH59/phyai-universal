name: phase8-evaluation

on:
  push:
    branches: [main]
    paths:
      - 'src/phase8_evaluation/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase8_evaluation.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/phase8_evaluation/**'
      - 'src/phase1_contracts/**'
      - 'tests/unit/test_phase8_evaluation.py'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/unit/test_phase8_evaluation.py -q
