name: Phase 9 Learned World Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase9-learned-world-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/unit/test_phase9_learned_world_model.py -q
